<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sayfa bulunamadı · Görev Mimarı</title>
  <meta name="robots" content="noindex">
  <meta name="color-scheme" content="dark light">
  <link rel="icon" type="image/png" sizes="32x32" href="%BASE_PATH%assets/favicon-32.png">
  <style>
    :root { --bg: #0f151c; --surface: #17202a; --ink: #e6ebf0; --muted: #a6b3c0; --accent: #7fb0ff; --accent-ink: #0f151c; color-scheme: dark; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--ink);
      font: 17px/1.5 'Segoe UI', system-ui, -apple-system, sans-serif; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
    main { max-width: 520px; display: grid; gap: 14px; padding-block: 40px; }
    img { width: 96px; height: 96px; }
    h1 { margin: 0; font-size: 32px; line-height: 1.2; }
    p { margin: 0; color: var(--muted); }
    a { justify-self: start; background: var(--accent); color: var(--accent-ink); text-decoration: none; font-weight: 700; padding: 10px 18px; border-radius: 6px; }
    a:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
  </style>
</head>
<body>
  <main>
    <img src="%BASE_PATH%assets/icon-192.png" alt="">
    <h1>Bu sayfa yörüngeden çıkmış</h1>
    <p>Aradığın sayfa bulunamadı. Görev Mimarı'nın ana sayfasına dönebilirsin.</p>
    <p lang="en">This page drifted out of orbit. The page you are looking for was not found.</p>
    <a href="%BASE_PATH%">Ana sayfaya dön · Back to the game</a>
  </main>
</body>
</html>
